[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtsql-typecheck"
version = "0.1.0"
description = "Type-related SQL logic bug detection via compatible database construction (offline generation core)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "nieyuanyuan" }]
# Runtime dependencies are standard library only by design (D1 6.7).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mt-typecheck = "mtsql_typecheck.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
